apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "petradar.labels" . | nindent 4 }}
    app: search-service
spec:
  replicas: {{ .Values.searchService.replicas }}
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: {{ include "petradar.image" (list . "search-service") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.searchService.port }}
          env:
            # Elasticsearch 연결 주소
            - name: SPRING_ELASTICSEARCH_URIS
              value: "http://elasticsearch:9200"
            # Kafka 연결 주소
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            # k8s 프로파일 활성화
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
          resources:
            {{- toYaml .Values.searchService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.searchService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.searchService.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
